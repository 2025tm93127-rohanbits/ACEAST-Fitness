# SonarQube static analysis configuration for ACEest Fitness & Gym.
# Used by the Jenkins "SonarQube analysis" stage (sonar-scanner reads this file).
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=1.1.0

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,venv/**,.venv/**,**/__pycache__/**,htmlcov/**,k8s/**
sonar.test.inclusions=tests/**

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Reports produced by: pytest --cov --cov-report=xml --junitxml=test-results.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
