name: CI

on:
  push:
    branches: [ main, develop, "release/**", "hotfix/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest -v --cov --cov-report=xml --cov-report=term --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage.xml

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('app.py').read()).group(1))")
          docker build \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg GIT_COMMIT="${GITHUB_SHA::7}" \
            -t aceest-fitness:ci .

      - name: Smoke test container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:ci
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:5000/health && exit 0
            sleep 2
          done
          docker logs aceest
          exit 1
